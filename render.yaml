services:
  - type: web
    name: taskflow-app
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: FLASK_DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
