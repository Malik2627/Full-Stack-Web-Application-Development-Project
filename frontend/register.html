<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow — Student Registration</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="auth-page-wrapper">
        <div class="auth-card" style="max-width: 480px;">
            <div class="auth-card-body">
                <!-- Auth Header -->
                <div class="auth-header">
                    <a href="index.html" class="text-decoration-none d-inline-block">
                        <div class="auth-logo">
                            <i class="bi bi-person-plus-fill"></i>
                        </div>
                    </a>
                    <h1 class="auth-title">Create Account</h1>
                    <p class="auth-subtitle">Join TaskFlow to organize your coursework and deadlines</p>
                </div>

                <!-- Alert Feedback Box -->
                <div id="register-alert" class="alert alert-danger d-none py-2 small" role="alert">
                    <div class="d-flex align-items-center gap-2">
                        <i class="bi bi-exclamation-triangle-fill"></i>
                        <span id="register-alert-msg"></span>
                    </div>
                </div>

                <!-- Registration Form -->
                <form id="register-form" novalidate>
                    <!-- Full Name Field -->
                    <div class="mb-3">
                        <label for="reg-name" class="form-label small fw-semibold">Full Name <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted">
                                <i class="bi bi-person"></i>
                            </span>
                            <input type="text" 
                                   class="form-control border-start-0" 
                                   id="reg-name" 
                                   placeholder="e.g. Alex Johnson" 
                                   autocomplete="name" 
                                   required>
                        </div>
                        <div class="invalid-feedback small" id="reg-name-err">Name is required.</div>
                    </div>

                    <!-- Email Field -->
                    <div class="mb-3">
                        <label for="reg-email" class="form-label small fw-semibold">Student Email <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted">
                                <i class="bi bi-envelope"></i>
                            </span>
                            <input type="email" 
                                   class="form-control border-start-0" 
                                   id="reg-email" 
                                   placeholder="e.g. alex@university.edu" 
                                   autocomplete="email" 
                                   required>
                        </div>
                        <div class="invalid-feedback small" id="reg-email-err">Please enter a valid email</div>
                    </div>

                    <!-- Password Field -->
                    <div class="mb-3">
                        <div class="d-flex justify-content-between align-items-center">
                            <label for="reg-password" class="form-label small fw-semibold">Password <span class="text-danger">*</span></label>
                            <span class="text-muted small" style="font-size: 0.75rem;">Min 6 characters</span>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted">
                                <i class="bi bi-lock"></i>
                            </span>
                            <input type="password" 
                                   class="form-control border-start-0 border-end-0" 
                                   id="reg-password" 
                                   placeholder="Create a strong password" 
                                   autocomplete="new-password" 
                                   minlength="6" 
                                   required>
                            <button class="btn btn-outline-secondary border-start-0 bg-light text-muted password-toggle-btn" 
                                    type="button" 
                                    id="toggle-reg-password-btn" 
                                    title="Show/Hide Password"
                                    aria-label="Show or hide password">
                                <i class="bi bi-eye" id="toggle-reg-password-icon"></i>
                            </button>
                        </div>
                        <div class="invalid-feedback small" id="reg-password-err">Password must be at least 6 characters.</div>
                    </div>

                    <!-- Confirm Password Field -->
                    <div class="mb-4">
                        <label for="reg-confirm-password" class="form-label small fw-semibold">Confirm Password <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted">
                                <i class="bi bi-shield-check"></i>
                            </span>
                            <input type="password" 
                                   class="form-control border-start-0 border-end-0" 
                                   id="reg-confirm-password" 
                                   placeholder="Re-type your password" 
                                   autocomplete="new-password" 
                                   required>
                            <button class="btn btn-outline-secondary border-start-0 bg-light text-muted password-toggle-btn" 
                                    type="button" 
                                    id="toggle-reg-confirm-btn" 
                                    title="Show/Hide Password"
                                    aria-label="Show or hide confirm password">
                                <i class="bi bi-eye" id="toggle-reg-confirm-icon"></i>
                            </button>
                        </div>
                        <div class="invalid-feedback small" id="reg-confirm-err">Passwords do not match</div>
                    </div>

                    <!-- Terms agreement checkbox -->
                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" id="terms-agree" checked required>
                        <label class="form-check-label small text-muted" for="terms-agree">
                            I agree to use TaskFlow for student academic management
                        </label>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" id="register-submit-btn" class="btn btn-primary w-100 py-2 d-flex align-items-center justify-content-center gap-2 shadow-sm">
                        <span>Create Account</span>
                        <i class="bi bi-arrow-right"></i>
                    </button>
                </form>

                <!-- Navigation Footer -->
                <div class="text-center mt-4">
                    <p class="small text-muted mb-2">
                        Already have an account? 
                        <a href="login.html" class="text-primary fw-semibold text-decoration-none">Sign In</a>
                    </p>
                    <a href="index.html" class="small text-muted text-decoration-none">
                        <i class="bi bi-arrow-left me-1"></i> Back to Landing Page
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- TaskFlow API Client -->
    <script src="js/api.js"></script>
    <!-- Register Controller -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('register-form');
            const nameInput = document.getElementById('reg-name');
            const emailInput = document.getElementById('reg-email');
            const passwordInput = document.getElementById('reg-password');
            const confirmInput = document.getElementById('reg-confirm-password');
            const submitBtn = document.getElementById('register-submit-btn');
            const alertBox = document.getElementById('register-alert');
            const alertMsg = document.getElementById('register-alert-msg');

            // Password toggles
            const setupToggle = (btnId, inputId, iconId) => {
                const btn = document.getElementById(btnId);
                const input = document.getElementById(inputId);
                const icon = document.getElementById(iconId);
                if (btn && input && icon) {
                    btn.addEventListener('click', () => {
                        const isPw = input.type === 'password';
                        input.type = isPw ? 'text' : 'password';
                        icon.className = isPw ? 'bi bi-eye-slash' : 'bi bi-eye';
                    });
                }
            };
            setupToggle('toggle-reg-password-btn', 'reg-password', 'toggle-reg-password-icon');
            setupToggle('toggle-reg-confirm-btn', 'reg-confirm-password', 'toggle-reg-confirm-icon');

            function showAlert(msg) {
                if (!alertBox || !alertMsg) return;
                alertMsg.textContent = msg;
                alertBox.classList.remove('d-none');
            }

            function hideAlert() {
                if (alertBox) alertBox.classList.add('d-none');
            }

            function isValidEmail(email) {
                return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
            }

            // Real-time live validation feedback
            nameInput.addEventListener('input', () => {
                if (nameInput.value.trim()) {
                    nameInput.classList.remove('is-invalid');
                }
            });

            emailInput.addEventListener('input', () => {
                const val = emailInput.value.trim();
                if (val && !isValidEmail(val)) {
                    emailInput.classList.add('is-invalid');
                } else {
                    emailInput.classList.remove('is-invalid');
                }
            });

            emailInput.addEventListener('blur', () => {
                const val = emailInput.value.trim();
                if (!val || !isValidEmail(val)) {
                    emailInput.classList.add('is-invalid');
                } else {
                    emailInput.classList.remove('is-invalid');
                }
            });

            passwordInput.addEventListener('input', () => {
                if (passwordInput.value && passwordInput.value.length >= 6) {
                    passwordInput.classList.remove('is-invalid');
                }
                if (confirmInput.value) {
                    if (confirmInput.value !== passwordInput.value) {
                        confirmInput.classList.add('is-invalid');
                    } else {
                        confirmInput.classList.remove('is-invalid');
                    }
                }
            });

            confirmInput.addEventListener('input', () => {
                if (confirmInput.value !== passwordInput.value) {
                    confirmInput.classList.add('is-invalid');
                } else {
                    confirmInput.classList.remove('is-invalid');
                }
            });

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                hideAlert();

                const name = nameInput.value.trim();
                const email = emailInput.value.trim();
                const password = passwordInput.value;
                const confirmPassword = confirmInput.value;

                let hasError = false;

                // Validate Name
                if (!name) {
                    nameInput.classList.add('is-invalid');
                    hasError = true;
                } else {
                    nameInput.classList.remove('is-invalid');
                }

                // Validate Email
                if (!email || !isValidEmail(email)) {
                    emailInput.classList.add('is-invalid');
                    hasError = true;
                } else {
                    emailInput.classList.remove('is-invalid');
                }

                // Validate Password
                if (!password || password.length < 6) {
                    passwordInput.classList.add('is-invalid');
                    hasError = true;
                } else {
                    passwordInput.classList.remove('is-invalid');
                }

                // Validate Password Match
                if (!confirmPassword || password !== confirmPassword) {
                    confirmInput.classList.add('is-invalid');
                    hasError = true;
                } else {
                    confirmInput.classList.remove('is-invalid');
                }

                if (hasError) {
                    if (password && confirmPassword && password !== confirmPassword) {
                        showAlert('Passwords do not match. Please re-enter.');
                    } else if (password && password.length < 6) {
                        showAlert('Password must be at least 6 characters long.');
                    } else {
                        showAlert('Please fill in all required fields correctly.');
                    }
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Creating account...';

                try {
                    const res = await window.TaskFlowAPI.register({ name, email, password });
                    if (res.ok) {
                        // User automatically logged in, redirect to dashboard
                        window.location.href = 'dashboard.html';
                    } else {
                        showAlert(res.message || 'Registration failed.');
                        if (res.errors && res.errors.email) {
                            emailInput.classList.add('is-invalid');
                        }
                    }
                } catch (err) {
                    showAlert('Connection error. Please ensure Flask server is running.');
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<span>Create Account</span><i class="bi bi-arrow-right ms-2"></i>';
                }
            });
        });
    </script>
</body>
</html>
